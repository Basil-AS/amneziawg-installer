name: Tests

on:
  push:
    branches: [main]
    paths: ['*.sh', 'scripts/**', 'tests/**', 'web/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['*.sh', 'scripts/**', 'tests/**', 'web/**', '.github/workflows/test.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SHA pin lockstep test compares each pin with the helper's
          # bytes at the tag the installer downloads from, so the tags and
          # their objects have to be here. On the branch and pull_request
          # events above the default checkout fetches neither (fetch-depth: 1,
          # fetch-tags: false), and the test then fails loudly rather than
          # degrade to a comparison that would mean nothing.
          fetch-depth: 0

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run unit tests
        run: bats tests/*.bats

      - name: Compile web panel server
        run: python3 -m py_compile web/server.py

      - name: Check frontend JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/awg_i1.js

      - name: Verify installer SHA manifest freshness
        run: |
          bash scripts/update-installer-sha-manifest.sh
          git diff --exit-code -- install_amneziawg.sh install_amneziawg_en.sh || {
            echo "Installer SHA manifest is stale. Run: bash scripts/update-installer-sha-manifest.sh" >&2
            exit 1
          }

      - name: Test optional WireSock-derived proxy
        run: |
          cargo test --locked --manifest-path amneziawg-proxy/Cargo.toml
          bash tests/test-proxy-scripts.sh
